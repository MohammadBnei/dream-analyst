# One run, one release: push to main -> quality + e2e + scan -> release (an annotated
# tag on the triggering commit, ukubi-ci release.yml) -> image build and push to the LAN
# registry with the pin committed to helm/image.yaml on the `deploy` branch (ukubi-ci
# image.yml). main is never written by CI. ArgoCD layers the pin file over helm/values.yaml
# once infra-bootstrap's entry sets deployPath; until then the cluster keeps values.yaml's tag.
#
# On a pull request the same chain is a dry run: release.yml only reports the version it
# would cut, and image.yml builds the image (on the ukubi-build runner, buildah) without
# logging in, pushing or bumping. That build is the PR's image check.
#
# Runs on Forgejo Actions. No runner has a docker daemon, so the image is built by buildah
# inside image.yml, and the Trivy gate scans the dependency tree (scan-type fs) rather than
# a loaded image.
name: Build, Test and Deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.yml'
      - 'v2_research/**'
      - 'front/package.json'
      - 'helm/**'
    tags-ignore:
      - '*'

permissions:
  contents: read

# Forgejo honours only workflow-level concurrency. main queues: a run whose release tag is
# already pushed must never be cancelled, or the tag is left with no image. PR updates
# cancel the older run.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `bun run check` runs the generators first (prisma generate + paraglide compile);
  # neither needs a reachable database.
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        # An exact version: without one the action asks GitHub's API for the latest tag,
        # unauthenticated from Forgejo, and hits the rate limit.
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test src/

  # Needs real Postgres and Redis. On Forgejo's container runner services are reached by
  # their service name, not localhost.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dreamer
        options: >-
          --health-cmd "pg_isready -U user -d dreamer"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://user:password@postgres:5432/dreamer?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ci-only-not-a-real-secret-0000000000000000
      # No LLM call happens in these tests; the value only has to be present.
      OPENROUTER_API_KEY: ci-placeholder
      ORIGIN: http://localhost:4173
      PUBLIC_ORIGIN: http://localhost:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        # An exact version: without one the action asks GitHub's API for the latest tag,
        # unauthenticated from Forgejo, and hits the rate limit.
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Integration tests
        run: bun run test:integration

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e
        run: bun run e2e

  # Security gate: fails on a fixable CRITICAL/HIGH in the dependency tree (bun.lock).
  # ponytail: no docker daemon to load the built image, so the base image's OS packages
  # are not scanned here; scan the pushed image from the registry if that gap matters.
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Not aquasecurity/trivy-action: its setup step clones aquasecurity/trivy from
      # github.com with the job token, which is Forgejo's and is refused there.
      - name: Install Trivy
        env:
          V: 0.70.0
          SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          set -euo pipefail
          f="trivy_${V}_Linux-64bit.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/aquasecurity/trivy/releases/download/v$V/$f"
          echo "$SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan dependencies
        run: >-
          trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed
          --exit-code 1 --cache-dir "$GITHUB_WORKSPACE/.cache/trivy"
          --ignorefile front/.trivyignore front

  # Pushes an annotated tag on the triggering commit (push/dispatch on main only); a dry
  # run everywhere else. Gated on the three checks above.
  release:
    needs: [quality, e2e, scan]
    permissions:
      contents: write # release.yml pushes the release tag
    uses: MohammadBnei/ukubi-ci/.github/workflows/release.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1

  # Builds front/ with buildah on the ukubi-build runner. On main it pushes <sha12> and
  # latest to registry.bnei.lan:5000/dream-analyst and commits the pin to helm/image.yaml
  # on the `deploy` branch; on a PR it only builds. Logs in to Infisical itself (Forgejo
  # OIDC) for REGISTRY_PASSWORD.
  image:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@9af316b5d779b2d5ef3f55b9f11e20b8bf3f6ce8 # v0.11.1
    with:
      runs-on: '["ukubi-build"]'
      image: dream-analyst
      ref: ${{ needs.release.outputs.tag }}
      context: front
      dockerfile: front/Dockerfile
      # The pin file on the deploy branch (created by the first run), not main's values.
      values-file: helm/image.yaml
      extra-tags: latest
      # VERSION build arg -> APP_VERSION (front/vite.config.ts); package.json is no longer bumped.
      version-arg: true
      version: ${{ needs.release.outputs.version }}
      # Never cancel a running build: its release tag is already pushed.
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
