# One run, one release: push to main -> quality + e2e + image scan -> release
# (version + changelog) -> image build and push to the local registry -> helm tag bump.
#
# This used to be two workflows chained by a tag push, which is the only reason it needed a
# PAT: release-it's tag had to TRIGGER the image build, and a tag pushed with the built-in
# GITHUB_TOKEN deliberately does not trigger workflows. Sequential jobs need no trigger, so
# nothing here holds a PAT.
#
# Every job runs on the self-hosted build box ([self-hosted, ukubi-build]): the account's hosted
# minutes are billing-locked. The box has git, curl, jq, tar, gcc and podman/buildah only (no
# node, unzip, docker, Chromium, apt), so: Node from setup-node, bun from npm, Postgres/Redis and
# the Playwright suite through `sudo buildah run`, and Trivy as a pinned binary scanning an
# archive of the buildah-built image.
name: Build, Test and Deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.yml'
      - 'v2_research/**'
      - 'front/package.json'
      - 'helm/**'
    tags-ignore:
      - '*'

# upload-sarif writes to the Security tab, which the default read-only token
# cannot do - the scan step would pass and the job would still fail on the
# upload.
permissions:
  contents: read
  security-events: write

# Concurrent releases: keep the newest, cancel the rest, so two pushes cannot compute the
# same version from the same latest tag and lose one of them.
concurrency:
  group: release
  cancel-in-progress: true

env:
  REGISTRY: registry.bnei.lan:5000
  IMAGE_NAME: dream-analyst
  # Plaintext on purpose. A username is not a secret, and holding it as one cost agent-fleet
  # a release: the secret was never set there, so buildah got `--username ""`.
  REGISTRY_USER: ci
  # The registry password comes from the shared platform-commons project over OIDC rather
  # than a repo secret (infra-bootstrap ADR-0049).
  INFISICAL_DOMAIN: https://infisical.bnei.dev
  INFISICAL_PROJECT_SLUG: platform-commons-76pb
  INFISICAL_ENV: dev
  INFISICAL_IDENTITY_ID: 19807471-d73a-48d4-9e58-1dc34255ef77
  # Single-arch: the only consumer is an amd64 cluster. Kept as a variable because the scan
  # build below needs `load: true`, which is only possible single-arch.
  PLATFORMS: linux/amd64
  # Local-only tag for the scan build. Never pushed anywhere, so it needs no registry host.
  SCAN_IMAGE: dream-analyst:scan

jobs:
  # Nothing verified that this project compiled before an image was built and
  # pushed. `bun run lint` and `bun run check` could not even execute (undeclared
  # typescript-eslint, and generated Prisma/Paraglide output that no step
  # produced), so 149 type errors and 90 lint errors accumulated unnoticed.
  quality:
    runs-on: [self-hosted, ukubi-build]
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # oven-sh/setup-bun unzips its release and the host has no unzip; the npm package ships the
      # same binary.
      - name: Set up Bun
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/bun" bun@1.4.2
          echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check` runs the generators first (prisma generate + paraglide compile);
      # neither needs a reachable database.
      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test src/

  # The e2e suite had never executed - see the note in playwright.config.ts. It
  # needs real Postgres and Redis, so it is a separate job rather than part of
  # `quality`, and build-push waits on both.
  e2e:
    runs-on: [self-hosted, ukubi-build]
    defaults:
      run:
        working-directory: front
    env:
      JWT_SECRET: ci-only-not-a-real-secret-0000000000000000
      # No LLM call happens in these tests; the value only has to be present.
      OPENROUTER_API_KEY: ci-placeholder
      ORIGIN: http://localhost:4173
      PUBLIC_ORIGIN: http://localhost:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # oven-sh/setup-bun unzips its release and the host has no unzip; the npm package ships the
      # same binary.
      - name: Set up Bun
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/bun" bun@1.4.2
          echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No docker `services:` on this runner: the same postgres:16-alpine and redis:7-alpine images
      # (from the ECR mirror, Docker Hub rate-limits the LAN's one address) run through sudo buildah
      # on the host network, on loopback ports picked per run, and are stopped at the end.
      - name: postgres and redis (buildah)
        run: |
          pgport=$((20000 + GITHUB_RUN_ID % 20000))
          rport=$((pgport + 20000))
          pg=$(sudo buildah from public.ecr.aws/docker/library/postgres:16-alpine)
          rd=$(sudo buildah from public.ecr.aws/docker/library/redis:7-alpine)
          echo "PG_CTR=$pg" >> "$GITHUB_ENV"
          echo "RD_CTR=$rd" >> "$GITHUB_ENV"
          nohup sudo buildah run --network host --env POSTGRES_USER=user --env POSTGRES_PASSWORD=password --env POSTGRES_DB=dreamer "$pg" -- \
            docker-entrypoint.sh postgres -c listen_addresses=127.0.0.1 -p "$pgport" >"$RUNNER_TEMP/pg.log" 2>&1 &
          echo "PG_PID=$!" >> "$GITHUB_ENV"
          nohup sudo buildah run --network host "$rd" -- redis-server --bind 127.0.0.1 --port "$rport" >"$RUNNER_TEMP/redis.log" 2>&1 &
          echo "RD_PID=$!" >> "$GITHUB_ENV"
          for p in $pgport $rport; do
            for i in $(seq 60); do (exec 3<>"/dev/tcp/127.0.0.1/$p") 2>/dev/null && break; sleep 2; done
            (exec 3<>"/dev/tcp/127.0.0.1/$p") || { cat "$RUNNER_TEMP/pg.log" "$RUNNER_TEMP/redis.log"; exit 1; }
          done
          echo "DATABASE_URL=postgres://user:password@127.0.0.1:$pgport/dreamer?sslmode=disable" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://127.0.0.1:$rport" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: bunx prisma migrate deploy

      # Integration tests exercise the real credit functions against this
      # job's Postgres. They cannot run in `quality`, which has no database.
      - name: Integration tests
        run: bun run test:integration

      # The host has none of Chromium's system libraries and the runner user cannot apt-get, so the
      # suite runs as root in Playwright's own image (1.62.0 = the lockfile's @playwright/test), on the
      # host network so it reaches Postgres and Redis. The workspace and the runner temp dir (bun) are
      # mounted at the same paths; sudo strips the environment, so the app's variables go in by value.
      - name: Run e2e (in the Playwright image)
        run: |
          set -euo pipefail
          ctr=$(sudo buildah from mcr.microsoft.com/playwright:v1.62.0-noble)
          trap 'sudo buildah rm "$ctr" >/dev/null' EXIT
          sudo buildah run --network host -v "$PWD:$PWD" -v "$RUNNER_TEMP:$RUNNER_TEMP" --workingdir "$PWD" \
            --env PATH="$RUNNER_TEMP/bun/node_modules/.bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            --env CI=true --env DATABASE_URL="$DATABASE_URL" --env REDIS_URL="$REDIS_URL" --env JWT_SECRET="$JWT_SECRET" \
            --env OPENROUTER_API_KEY="$OPENROUTER_API_KEY" --env ORIGIN="$ORIGIN" --env PUBLIC_ORIGIN="$PUBLIC_ORIGIN" \
            --env OWNER="$(id -u):$(id -g)" \
            "$ctr" -- bash -c 'rc=0; bun run e2e || rc=$?; chown -R "$OWNER" "$PWD"; exit $rc'

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright/report
          retention-days: 7

      - name: Stop postgres and redis
        if: always()
        run: |
          kill "$PG_PID" "$RD_PID" 2>/dev/null || true # sudo relays the signal to buildah run, which stops the container
          sleep 3
          sudo buildah rm "$PG_CTR" "$RD_CTR" || true

  # Renamed from build-push: it no longer pushes anything. Its whole job is to be the security
  # gate. aquasecurity/trivy-action is Docker-based and the build box has buildah and no docker
  # daemon, so the scan is the pinned trivy release binary (sha256-checked) run over a tar archive
  # of the image buildah just built: the same flags the action was given.
  scan:
    runs-on: [self-hosted, ukubi-build]
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf # trivy_0.76.2_Linux-64bit.tar.gz
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Builds but never pushes, and scans THIS build's archive. Scanning by name would let Trivy
      # silently pull the LAST PUBLISHED tag and scan that instead — a green scan of code nobody
      # proposed. Layers cache in the box's buildah store between runs. Single-arch, see PLATFORMS.
      - name: Build the image for scanning
        run: |
          set -euo pipefail
          sudo buildah bud --isolation chroot --format docker --platform "$PLATFORMS" \
            -t "localhost/$SCAN_IMAGE" front
          rm -f "$RUNNER_TEMP/scan.tar"
          # Written by root, world-readable; the runner user reads it and may delete it (it owns the dir).
          sudo buildah push "localhost/$SCAN_IMAGE" "docker-archive:$RUNNER_TEMP/scan.tar:$SCAN_IMAGE"
          sudo buildah rmi "localhost/$SCAN_IMAGE" || true

      - name: Install Trivy
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      # Severity applies to the SARIF too, so the Security tab receives only what the gate blocks on
      # and `exit-code 1` cannot fire on a LOW (the old action needed limit-severities-for-sarif for
      # the same thing).
      - name: Scan Docker image
        run: |
          trivy image --input "$RUNNER_TEMP/scan.tar" \
            --format sarif --output trivy-results.sarif \
            --severity CRITICAL,HIGH --pkg-types os,library --ignore-unfixed \
            --exit-code 1 --cache-dir "$RUNNER_TEMP/trivy-cache"

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  # Cuts the version and CHANGELOG in the same run as the build, which is what removes the
  # PAT: release-it's tag no longer has to trigger anything. It only pushes a commit and a
  # tag (github.release is false in front/package.json), which contents: write covers.
  #
  # Gated on all three checks above. Previously the release lived in its own workflow on its
  # own trigger, so a red e2e could not stop a version being cut.
  release:
    needs: [quality, e2e, scan]
    if: github.event_name == 'push'
    runs-on: [self-hosted, ukubi-build]
    permissions:
      contents: write
    defaults:
      run:
        working-directory: front
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # oven-sh/setup-bun unzips its release and the host has no unzip; the npm package ships the
      # same binary.
      - name: Set up Bun
        run: |
          npm install --no-save --no-package-lock --prefix "$RUNNER_TEMP/bun" bun@1.4.2
          echo "$RUNNER_TEMP/bun/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: bun install

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Run release-it
        run: git update-index --refresh && git diff-index --quiet HEAD || git reset --hard && bun run release

      - name: Read the released version
        id: version
        run: |
          set -euo pipefail
          v=$(jq -er .version package.json)
          [ -n "$v" ] || { echo "no version in front/package.json"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  # On the self-hosted box because the registry is LAN-only: a GitHub-hosted runner cannot
  # reach it, and pushing layers up a residential uplink is the slow direction this whole
  # arrangement exists to avoid (ADR-0034).
  build-push:
    needs: release
    # always() + a result check, not the implicit success()-on-needs: `release` is push-only,
    # so a workflow_dispatch skips it, and an implicit condition would skip this job too —
    # taking the seeding run with it. 'skipped' passes here, 'failure' does not.
    # Never on a pull_request: it would push the PR's image as :latest.
    if: always() && github.event_name != 'pull_request' && needs.release.result != 'failure'
    # NOT the bare `ukubi` label: that runner holds a ServiceAccount token with `create
    # jobs` in vos/vos-dev. This box has no cluster access at all, which is why builds
    # belong on it.
    runs-on: [self-hosted, ukubi-build]
    # id-token mints the OIDC token Infisical authenticates. Declaring any permissions block
    # zeroes the rest, so contents: read is restated for checkout.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v5
        with:
          # The tag release-it just made, not the commit that started the run: the version in
          # front/package.json at that SHA is the one being built. On a dispatch there is no
          # release, so fall back to whatever ref was dispatched.
          ref: ${{ needs.release.outputs.version || github.ref }}
          fetch-depth: 0

      # Not baked into the runner image. `sudo apt-get` only works for this — the sudoers
      # entry on that box grants /usr/bin/buildah and nothing else, so anything else a job
      # tries to install hangs on a password prompt.
      - name: Ensure buildah
        run: command -v buildah || (sudo apt-get update -qq && sudo apt-get install -y -qq buildah)

      # Only REGISTRY_PASSWORD, not the whole environment.
      - name: Read the registry password from Infisical
        uses: Infisical/secrets-action@v1.0.12
        with:
          method: oidc
          identity-id: ${{ env.INFISICAL_IDENTITY_ID }}
          oidc-audience: infisical.bnei.dev
          domain: ${{ env.INFISICAL_DOMAIN }}
          project-slug: ${{ env.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ env.INFISICAL_ENV }}
          secret-path: /
          secret-name: REGISTRY_PASSWORD
          export-type: env

      # GitHub only auto-masks `secrets.*`, and this action's README does not document
      # masking. An unmasked Infisical value leaked a token in cleartext in this estate once.
      - name: Mask the fetched password
        run: echo "::add-mask::$REGISTRY_PASSWORD"

      # --tls-verify=false: the registry is plain HTTP, because Let's Encrypt cannot issue
      # for `.lan`. Anonymous reads are open, which is how the nodes pull without
      # credentials; pushing needs this. Every buildah call goes through sudo and they must
      # all agree — a rootless login writes an auth file a rootful push cannot see.
      - name: Registry login
        run: |
          set -euo pipefail
          [ -n "${REGISTRY_PASSWORD:-}" ] || { echo "Infisical returned no REGISTRY_PASSWORD"; exit 1; }
          printf '%s' "$REGISTRY_PASSWORD" | sudo buildah login \
            --tls-verify=false \
            --username "$REGISTRY_USER" \
            --password-stdin "$REGISTRY"

      # On a release run this is the release job's output. On a dispatch there is no release,
      # so read it from the checked-out tree — which is what makes a dispatch able to seed the
      # registry with the current version before helm/values.yaml is flipped to it.
      - name: Resolve the version
        id: v
        run: |
          set -euo pipefail
          v="${{ needs.release.outputs.version }}"
          [ -n "$v" ] || v=$(jq -er .version front/package.json)
          [ -n "$v" ] || { echo "could not determine a version"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          # Context is front/, same as the buildx build above; the Dockerfile lives there.
          sudo buildah bud \
            --isolation chroot \
            --format docker \
            -t "$REGISTRY/$IMAGE_NAME:$VERSION" \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            front
          for tag in "$VERSION" latest; do
            sudo buildah push --tls-verify=false "$REGISTRY/$IMAGE_NAME:$tag"
          done

      # Only this build's tags. NEVER `buildah rmi --all` — the box is shared with the other
      # build repos and the base-image cache is the whole reason they live together.
      - name: Clean up this build's images
        if: always()
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          for tag in "$VERSION" latest; do
            sudo buildah rmi "$REGISTRY/$IMAGE_NAME:$tag" 2>/dev/null || true
          done

  deploy:
    needs: [release, build-push]
    # always() + explicit result checks rather than the implicit success()-on-needs, which
    # agent-fleet was bitten by: green builds with a skipped job upstream still skipped the
    # deploy. This commit is what ArgoCD reads — the image existing in the registry is not a
    # deployment.
    if: >-
      always() && github.event_name == 'push' &&
      needs.release.result == 'success' &&
      needs.build-push.result == 'success'
    runs-on: [self-hosted, ukubi-build]
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: 'main'

      # The version comes from the release job rather than being re-read here with
      # jaywcjlove/github-action-package. One source means build and deploy cannot disagree
      # and pin a tag no image carries — the failure agent-fleet's workflow documented.
      - name: Update Helm image tag
        run: |
          sed -i "s/^  tag: \".*\"$/  tag: \"${VERSION}\"/" helm/values.yaml

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add helm/values.yaml
          git diff --cached --quiet && { echo "tag unchanged"; exit 0; }
          git commit -m "chore: update image version to ${VERSION} (helm)"
          # Another commit can land while the image builds; rebase rather than fail the
          # release after the image is already in the registry.
          git pull --rebase --autostash origin main
          git push
