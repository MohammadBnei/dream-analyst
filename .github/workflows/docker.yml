# One run, one release: push to main -> quality + e2e + scan -> release (an annotated
# tag on the triggering commit, ukubi-ci release.yml) -> image build and push to the LAN
# registry with the pin committed to helm/image.yaml on the `deploy` branch (ukubi-ci
# image.yml). main is never written by CI. ArgoCD layers the pin file over helm/values.yaml
# once infra-bootstrap's entry sets deployPath; until then the cluster keeps values.yaml's tag.
#
# On a pull request the same chain is a dry run: release.yml only reports the version it
# would cut, and image.yml builds the image (on the ukubi-build runner, buildah) without
# logging in, pushing or bumping. That build is the PR's image check.
#
# Runs on Forgejo Actions. No runner has a docker daemon, so the image is built by buildah
# inside image.yml, and the Trivy gate scans the dependency tree (scan-type fs) rather than
# a loaded image.
name: Build, Test and Deploy

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.yml'
      - 'v2_research/**'
      - 'front/package.json'
      - 'helm/**'
    tags-ignore:
      - '*'

permissions:
  contents: read

# Forgejo honours only workflow-level concurrency. main queues: a run whose release tag is
# already pushed must never be cancelled, or the tag is left with no image. PR updates
# cancel the older run.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `bun run check` runs the generators first (prisma generate + paraglide compile);
  # neither needs a reachable database.
  quality:
    runs-on: k8s-ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        # An exact version: without one the action asks GitHub's API for the latest tag,
        # unauthenticated from Forgejo, and hits the rate limit.
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test src/

  # Needs real Postgres and Redis. The Talos runner has no service containers, so Postgres is a
  # disposable database from the dev IntegreSQL (ADR-0088, ukubi-ci's dev-db action; the template is
  # the migrated schema) and Redis is built from its pinned source tarball and run on 127.0.0.1.
  e2e:
    runs-on: k8s-ubuntu-latest
    defaults:
      run:
        working-directory: front
    env:
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-not-a-real-secret-0000000000000000
      # No LLM call happens in these tests; the value only has to be present.
      OPENROUTER_API_KEY: ci-placeholder
      ORIGIN: http://localhost:4173
      PUBLIC_ORIGIN: http://localhost:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        # An exact version: without one the action asks GitHub's API for the latest tag,
        # unauthenticated from Forgejo, and hits the rate limit.
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # DATABASE_URL points at this job's own database, cloned from the migrated template. The
      # template is rebuilt (seed-command) only when the migrations or the schema change.
      - name: Dev database
        uses: MohammadBnei/ukubi-ci/actions/dev-db@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release
        with:
          integresql-url: http://integresql.dev-services.svc.cluster.local:5000
          postgres-host: dev-postgres.dev-services.svc.cluster.local
          hash-paths: front/prisma/migrations front/prisma/schema.prisma
          seed-command: cd "$GITHUB_WORKSPACE/front" && bunx prisma migrate deploy
          timeout-seconds: '600'

      # No redis on the runner and no apt: build the pinned release. A binary already in
      # ~/.cache/redis-bin is reused.
      - name: Redis
        env:
          V: 7.4.6
          SHA256: 73b94484e00fb4c2440b490dc4021142fb0b6efc8b64c6329c10d24f0b531c99
        run: |
          set -euo pipefail
          bin="$HOME/.cache/redis-bin"
          if [ ! -x "$bin/redis-server" ]; then
            f="$RUNNER_TEMP/redis.tgz"
            curl -sSfLo "$f" "https://download.redis.io/releases/redis-$V.tar.gz"
            echo "$SHA256  $f" | sha256sum -c -
            tar -xzf "$f" -C "$RUNNER_TEMP"
            make -C "$RUNNER_TEMP/redis-$V" -j2 BUILD_TLS=no MALLOC=libc >/dev/null
            mkdir -p "$bin"
            cp "$RUNNER_TEMP/redis-$V/src/redis-server" "$RUNNER_TEMP/redis-$V/src/redis-cli" "$bin/"
          fi
          "$bin/redis-server" --daemonize yes --save "" --appendonly no --bind 127.0.0.1 --port 6379 >/dev/null
          for _ in $(seq 30); do "$bin/redis-cli" ping 2>/dev/null | grep -q PONG && exit 0; sleep 1; done
          echo "::error::redis did not start"; exit 1

      - name: Integration tests
        run: bun run test:integration

      # No --with-deps: that needs apt, and the runner image already has the system libraries.
      # Browsers land in PLAYWRIGHT_BROWSERS_PATH, which the job user owns; a revision the image
      # already has is not downloaded again.
      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Run e2e
        run: bun run e2e

      - name: Give the dev database back
        if: always()
        uses: MohammadBnei/ukubi-ci/actions/dev-db-release@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release

  # Security gate: fails on a fixable CRITICAL/HIGH in the dependency tree (bun.lock).
  # ponytail: no docker daemon to load the built image, so the base image's OS packages
  # are not scanned here; scan the pushed image from the registry if that gap matters.
  scan:
    runs-on: k8s-ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Not aquasecurity/trivy-action: its setup step clones aquasecurity/trivy from
      # github.com with the job token, which is Forgejo's and is refused there.
      - name: Install Trivy
        env:
          V: 0.70.0
          SHA256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
        run: |
          set -euo pipefail
          f="trivy_${V}_Linux-64bit.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$f" "https://github.com/aquasecurity/trivy/releases/download/v$V/$f"
          echo "$SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" trivy
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan dependencies
        run: >-
          trivy fs --scanners vuln --severity CRITICAL,HIGH --ignore-unfixed
          --exit-code 1 --cache-dir "$GITHUB_WORKSPACE/.cache/trivy"
          --ignorefile front/.trivyignore front

  # Pushes an annotated tag on the triggering commit (push/dispatch on main only); a dry
  # run everywhere else. Gated on the three checks above.
  release:
    needs: [quality, e2e, scan]
    permissions:
      contents: write # release.yml pushes the release tag
    uses: MohammadBnei/ukubi-ci/.github/workflows/release.yml@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release

  # Builds front/ with buildah on the ukubi-build runner. On main it pushes <sha12> and
  # latest to registry.bnei.lan:5000/dream-analyst and commits the pin to helm/image.yaml
  # on the `deploy` branch; on a PR it only builds. Logs in to Infisical itself (Forgejo
  # OIDC) for REGISTRY_PASSWORD.
  image:
    needs: release
    uses: MohammadBnei/ukubi-ci/.github/workflows/image.yml@d683f2091575188024f7e1200e619977d9db19ae # ukubi-ci PR 28 head; re-pin to the release
    with:
      runs-on: '["ukubi-build"]'
      image: dream-analyst
      ref: ${{ needs.release.outputs.tag }}
      context: front
      dockerfile: front/Dockerfile
      # The pin file on the deploy branch (created by the first run), not main's values.
      values-file: helm/image.yaml
      extra-tags: latest
      # VERSION build arg -> APP_VERSION (front/vite.config.ts); package.json is no longer bumped.
      version-arg: true
      version: ${{ needs.release.outputs.version }}
      # Never cancel a running build: its release tag is already pushed.
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
