name: Build, Test and Deploy

on:
  pull_request:
  push:
    tags:
      - '*'

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/dream-analyst
  # PLATFORMS: ${{ github.event_name == 'push' && 'linux/amd64, linux/arm64' || 'linux/amd64' }}
  PLATFORMS: linux/amd64

jobs:
  # Nothing verified that this project compiled before an image was built and
  # pushed. `bun run lint` and `bun run check` could not even execute (undeclared
  # typescript-eslint, and generated Prisma/Paraglide output that no step
  # produced), so 149 type errors and 90 lint errors accumulated unnoticed.
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check` runs the generators first (prisma generate + paraglide compile);
      # neither needs a reachable database.
      - name: Typecheck
        run: bun run check

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun test src/

  # The e2e suite had never executed - see the note in playwright.config.ts. It
  # needs real Postgres and Redis, so it is a separate job rather than part of
  # `quality`, and build-push waits on both.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dreamer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d dreamer"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://user:password@localhost:5432/dreamer?sslmode=disable
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-not-a-real-secret-0000000000000000
      # No LLM call happens in these tests; the value only has to be present.
      OPENROUTER_API_KEY: ci-placeholder
      ORIGIN: http://localhost:4173
      PUBLIC_ORIGIN: http://localhost:4173
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply migrations
        run: bunx prisma migrate deploy

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run e2e
        run: bun run e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: front/playwright/report
          retention-days: 7

  build-push:
    runs-on: ubuntu-latest
    needs: [quality, e2e]
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: package.json info
        id: info
        uses: jaywcjlove/github-action-package@v2.0.0
        with:
          path: front/package.json


      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'push' }}
          context: front
          tags: ${{ env.IMAGE_NAME }}:${{ steps.info.outputs.version }}, ${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:buildcache,mode=max

      # Previously this ran AFTER the push, wrote a SARIF file that nothing
      # uploaded, and never failed the build - so it could not block anything.
      # Now it fails the job on a fixable CRITICAL/HIGH, and the report is
      # uploaded to the Security tab either way.
      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.info.outputs.version }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: true
          exit-code: '1'
          cache-dir: ${{ github.workspace }}/.cache/trivy

      - name: Upload Trivy results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'main'
          token: ${{ secrets.PAT }}

      - name: package.json info
        id: info
        uses: jaywcjlove/github-action-package@v2.0.0
        with:
          path: front/package.json

      - name: Update Helm image tag
        run: |
          sed -i "s/^  tag: \".*\"\$/  tag: \"${{ steps.info.outputs.version }}\"/" helm/values.yaml

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: git push
        run: |
          git add helm/values.yaml
          git commit -m "Chore: update image version to ${{ steps.info.outputs.version }} (helm)"
          git push
